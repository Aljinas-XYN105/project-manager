<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1B2860"/>
      <stop offset="38%"  stop-color="#1a56c4"/>
      <stop offset="100%" stop-color="#00AAEF"/>
    </linearGradient>
    <!-- Left V shape clip — slightly overlapped by right V -->
    <linearGradient id="lg-left" x1="0" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1B2860"/>
      <stop offset="100%" stop-color="#1a56c4"/>
    </linearGradient>
    <linearGradient id="lg-right" x1="28" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a6ede"/>
      <stop offset="100%" stop-color="#00AAEF"/>
    </linearGradient>
  </defs>

  <!-- White rounded-square background -->
  <rect width="64" height="64" rx="14" fill="white"/>

  <!-- Left V (dark navy → mid-blue) -->
  <path d="M7,10 L20.5,51 L32,22 L32,22"
        fill="none"
        stroke="url(#lg-left)"
        stroke-width="10.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Right V (mid-blue → cyan) — drawn on top so overlap looks natural -->
  <path d="M32,22 L43.5,51 L57,10"
        fill="none"
        stroke="url(#lg-right)"
        stroke-width="10.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
